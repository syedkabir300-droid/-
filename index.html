
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Access Portal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0b0e14;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(22, 27, 34, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 16px;
      padding: 32px 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.15);
      backdrop-filter: blur(10px);
    }
    .badge {
      display: inline-block;
      padding: 5px 14px;
      background: rgba(0, 240, 255, 0.15);
      color: #00f0ff;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }
    h2 {
      font-size: 21px;
      margin-bottom: 8px;
      font-weight: 700;
      color: #ffffff;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 25px;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      transition: transform 0.15s ease;
      text-align: center;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-telegram {
      background: linear-gradient(135deg, #0088cc, #00f0ff);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
    }
    .btn-register {
      background: linear-gradient(135deg, #ff007f, #ff5e62);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.35);
    }
    .loader {
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-top: 2px solid #00f0ff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .footer-text {
      font-size: 12px;
      color: #64748b;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">OFFICIAL VIP PORTAL</div>
    <h2>Telangana VIP Channel</h2>
    <p>Daily verified updates aur official game registration ke liye niche select karein:</p>

    <!-- 1. Telegram Deep Link Button -->
    <a id="telegramBtn" class="btn btn-telegram" href="https://t.me/+GMTnuLiWcr4wOTQ1">🚀 JOIN VIP TELEGRAM</a>

    <!-- 2. Game Register Link Button -->
    <a class="btn btn-register" href="https://maanwin66.com/register?inviteCode=JW8ZRYN&from=web" target="_blank">🎮 REGISTER OFFICIAL GAME</a>

    <div class="footer-text">
      <span class="loader"></span> Opening Telegram app...
    </div>
  </div>

  <script>
    // Private invite hash
    const privateInviteHash = "GMTnuLiWcr4wOTQ1";

    const appUrl = "tg://join?invite=" + privateInviteHash;
    const webUrl = "https://t.me/+" + privateInviteHash;

    // Direct Telegram App trigger (Meta in-app browser bypass)
    window.location.href = appUrl;

    // Fallback: Agar kisi device mein deep-link trigger na ho
    setTimeout(() => {
      document.getElementById("telegramBtn").href = webUrl;
    }, 1500);
  </script>

</body>
</html>
